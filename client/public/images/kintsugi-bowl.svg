<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="kint-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EDE6"/>
      <stop offset="100%" stop-color="#D7CCC0"/>
    </linearGradient>
    <linearGradient id="charcoal-clay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241F1D"/>
      <stop offset="40%" stop-color="#473E3B"/>
      <stop offset="80%" stop-color="#2E2825"/>
      <stop offset="100%" stop-color="#1A1615"/>
    </linearGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE182"/>
      <stop offset="50%" stop-color="#E2A638"/>
      <stop offset="100%" stop-color="#9C6B14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#kint-bg)"/>
  <ellipse cx="400" cy="640" rx="280" ry="28" fill="rgba(25,20,18,0.28)"/>
  <!-- Deep Flared Charcoal Bowl Body -->
  <path d="M120 340 Q130 520 280 610 Q320 625 400 625 Q480 625 520 610 Q670 520 680 340 Z" fill="url(#charcoal-clay)"/>
  <!-- Exposed Terracotta Foot Ring -->
  <ellipse cx="400" cy="625" rx="100" ry="14" fill="#8F4829"/>
  <!-- Deep Glazed Interior -->
  <ellipse cx="400" cy="340" rx="280" ry="75" fill="#2E2724" stroke="#4F4440" stroke-width="3"/>
  <ellipse cx="400" cy="345" rx="250" ry="60" fill="#1C1715"/>
  <ellipse cx="400" cy="350" rx="210" ry="46" fill="#120F0E"/>
  <!-- Golden Kintsugi Fracture Line running from rim down into basin -->
  <path d="M220 330 Q270 360 290 410 Q320 450 310 500 Q330 540 370 580 Q390 600 410 620" fill="none" stroke="url(#gold-metal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M290 410 Q340 420 360 450" fill="none" stroke="url(#gold-metal)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M310 500 Q260 520 250 540" fill="none" stroke="url(#gold-metal)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="220" cy="330" r="6" fill="#FCE182"/>
  <!-- Wooden Chopstick notch on rim -->
  <ellipse cx="610" cy="350" rx="14" ry="7" fill="#695A54"/>
</svg>
