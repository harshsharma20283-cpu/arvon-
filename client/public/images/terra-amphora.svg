<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="amphora-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6EFE6"/>
      <stop offset="100%" stop-color="#E2D2C0"/>
    </linearGradient>
    <linearGradient id="terracotta-vessel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A84E29"/>
      <stop offset="35%" stop-color="#D9754C"/>
      <stop offset="70%" stop-color="#B6552E"/>
      <stop offset="100%" stop-color="#7A3315"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#amphora-bg)"/>
  <ellipse cx="400" cy="670" rx="190" ry="24" fill="rgba(40,20,10,0.25)"/>
  <!-- Left Ear Handle -->
  <path d="M320 280 C200 280 200 440 280 470" fill="none" stroke="url(#terracotta-vessel)" stroke-width="32" stroke-linecap="round"/>
  <!-- Right Ear Handle -->
  <path d="M480 280 C600 280 600 440 520 470" fill="none" stroke="url(#terracotta-vessel)" stroke-width="32" stroke-linecap="round"/>
  <!-- Amphora Body -->
  <path d="M350 200 Q360 250 320 320 C240 430 260 550 330 620 L350 640 Q350 650 400 650 Q450 650 450 640 L470 620 C540 550 560 430 480 320 Q440 250 450 200 Z" fill="url(#terracotta-vessel)"/>
  <!-- Neck and Flared Lip -->
  <ellipse cx="400" cy="200" rx="60" ry="18" fill="#C26038" stroke="#873919" stroke-width="2"/>
  <ellipse cx="400" cy="200" rx="46" ry="12" fill="#4A1E0B"/>
  <!-- Artisan Carved Geometric Pattern -->
  <path d="M310 400 Q400 430 490 400" stroke="#7A3315" stroke-width="4" fill="none"/>
  <path d="M305 420 Q400 450 495 420" stroke="#7A3315" stroke-width="4" fill="none"/>
  <!-- Terracotta Clay Texture Dots -->
  <circle cx="370" cy="480" r="3" fill="#6E2B0E" opacity="0.5"/>
  <circle cx="430" cy="510" r="2.5" fill="#6E2B0E" opacity="0.6"/>
  <circle cx="390" cy="550" r="3" fill="#6E2B0E" opacity="0.5"/>
</svg>
