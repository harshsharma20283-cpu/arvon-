<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="monolith-detail-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAE3D8"/>
      <stop offset="100%" stop-color="#C5B6A3"/>
    </linearGradient>
    <linearGradient id="solid-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEC99"/>
      <stop offset="50%" stop-color="#D4A033"/>
      <stop offset="100%" stop-color="#805912"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#monolith-detail-bg)"/>
  <!-- Top-down view of heavy charcoal block and solid brass insert -->
  <rect x="150" y="200" width="500" height="400" rx="40" fill="#292320" stroke="#423A36" stroke-width="4"/>
  <circle cx="320" cy="400" r="70" fill="url(#solid-brass)"/>
  <circle cx="320" cy="400" r="35" fill="#422E0A"/>
  <circle cx="500" cy="400" r="40" fill="url(#solid-brass)"/>
  <circle cx="500" cy="400" r="8" fill="#1C1613"/>
  <text x="400" y="670" font-family="'Cinzel', serif" font-size="24" font-weight="700" fill="#4A3D36" letter-spacing="4" text-anchor="middle">ARVON MONOLITH</text>
</svg>
