<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="catchall-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6EFE6"/>
      <stop offset="100%" stop-color="#DDD0BF"/>
    </linearGradient>
    <linearGradient id="speckled-clay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7CCC0"/>
      <stop offset="40%" stop-color="#FAF5EE"/>
      <stop offset="80%" stop-color="#DFD4C5"/>
      <stop offset="100%" stop-color="#BFB09D"/>
    </linearGradient>
    <linearGradient id="gold-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEC8B"/>
      <stop offset="50%" stop-color="#D9A336"/>
      <stop offset="100%" stop-color="#8C5F10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#catchall-bg)"/>
  <ellipse cx="400" cy="630" rx="260" ry="26" fill="rgba(40,30,20,0.2)"/>
  <!-- Tripod Rounded Clay Feet -->
  <circle cx="280" cy="570" r="30" fill="#9E5334"/>
  <circle cx="520" cy="570" r="30" fill="#75381E"/>
  <circle cx="400" cy="590" r="32" fill="#8C4425"/>
  <!-- Shallow Footed Basin Body -->
  <path d="M160 410 Q180 570 400 570 Q620 570 640 410 Z" fill="url(#speckled-clay)"/>
  <!-- Wide Smooth Concave Basin Dish -->
  <ellipse cx="400" cy="410" rx="240" ry="65" fill="#E8DDD0" stroke="#BAAA96" stroke-width="2.5"/>
  <ellipse cx="400" cy="412" rx="210" ry="50" fill="#FAF5ED"/>
  <!-- Mineral Clay Speckles -->
  <circle cx="340" cy="420" r="3" fill="#4A3828" opacity="0.6"/>
  <circle cx="460" cy="405" r="2.5" fill="#4A3828" opacity="0.7"/>
  <circle cx="420" cy="435" r="3" fill="#4A3828" opacity="0.5"/>
  <circle cx="300" cy="410" r="2" fill="#4A3828" opacity="0.55"/>
  <circle cx="500" cy="425" r="2.5" fill="#4A3828" opacity="0.5"/>
  <!-- Golden Artisan Ring resting gracefully inside the dish -->
  <ellipse cx="370" cy="415" rx="35" ry="18" fill="none" stroke="url(#gold-ring)" stroke-width="8"/>
  <circle cx="390" cy="405" r="5" fill="#FFFFFF"/>
  <!-- Natural Quartz Crystal Point in dish -->
  <polygon points="460,400 480,415 450,430 435,415" fill="#EAE5F2" stroke="#B8A8D0" stroke-width="1.5" opacity="0.85"/>
</svg>
