<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="alba-close-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE6DC"/>
      <stop offset="100%" stop-color="#D7C5B0"/>
    </linearGradient>
    <linearGradient id="column-texture" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8A999"/>
      <stop offset="50%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#A69787"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#alba-close-bg)"/>
