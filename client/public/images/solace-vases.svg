<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="solace-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EEE5"/>
      <stop offset="100%" stop-color="#DDD0BF"/>
    </linearGradient>
    <linearGradient id="vase-oatmeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7CCC0"/>
      <stop offset="50%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#BDB09E"/>
    </linearGradient>
    <linearGradient id="vase-olive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55664E"/>
      <stop offset="50%" stop-color="#7B9172"/>
      <stop offset="100%" stop-color="#404F3B"/>
    </linearGradient>
    <linearGradient id="vase-clay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E4E2C"/>
      <stop offset="50%" stop-color="#CC6E48"/>
      <stop offset="100%" stop-color="#7A361A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#solace-bg)"/>
  <!-- Shadows for the trio -->
  <ellipse cx="240" cy="620" rx="90" ry="16" fill="rgba(40,30,20,0.2)"/>
  <ellipse cx="400" cy="640" rx="110" ry="20" fill="rgba(40,30,20,0.25)"/>
  <ellipse cx="560" cy="620" rx="90" ry="16" fill="rgba(40,30,20,0.2)"/>

  <!-- Left Vase: Oatmeal Spherical Bud Vase with Eucalyptus Sprig -->
  <path d="M225 350 L220 400 C150 440 150 560 210 600 L270 600 C330 560 330 440 260 400 L255 350 Z" fill="url(#vase-oatmeal)"/>
  <ellipse cx="240" cy="350" rx="20" ry="6" fill="#F4EDE4" stroke="#BAAFA0"/>
  <ellipse cx="240" cy="350" rx="14" ry="4" fill="#3D3328"/>
  <path d="M240 350 Q230 250 200 180" stroke="#7A8068" stroke-width="2.5" fill="none"/>
  <ellipse cx="215" cy="220" rx="12" ry="6" transform="rotate(-30 215 220)" fill="#687355"/>
  <ellipse cx="230" cy="270" rx="14" ry="7" transform="rotate(25 230 270)" fill="#7C8768"/>

  <!-- Center Vase: Tall Fluted Dusty Olive Cylinder Vase with Wild Grass -->
  <path d="M360 260 L350 610 Q350 625 375 625 L425 625 Q450 625 450 610 L440 260 Z" fill="url(#vase-olive)"/>
  <ellipse cx="400" cy="260" rx="42" ry="12" fill="#758A6E" stroke="#4F6148"/>
  <ellipse cx="400" cy="260" rx="30" ry="8" fill="#2A3626"/>
  <path d="M400 260 Q410 160 430 80" stroke="#8A7760" stroke-width="2" fill="none"/>
  <ellipse cx="420" cy="120" rx="4" ry="18" transform="rotate(15 420 120)" fill="#9C886E"/>

  <!-- Right Vase: Burnt Terracotta Teardrop Pitcher -->
  <path d="M545 320 L540 370 C480 430 480 570 535 600 L585 600 C640 570 640 430 580 370 L575 320 Z" fill="url(#vase-clay)"/>
  <ellipse cx="560" cy="320" rx="20" ry="6" fill="#C96C46" stroke="#873F20"/>
  <ellipse cx="560" cy="320" rx="14" ry="4" fill="#421B0A"/>
  <path d="M560 320 Q580 230 550 160" stroke="#8C5C42" stroke-width="2" fill="none"/>
  <circle cx="550" cy="160" r="7" fill="#BD724B"/>
</svg>
