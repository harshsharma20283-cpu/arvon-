  <circle cx="360" cy="370" r="2.5" fill="#4A3828" opacity="0.6"/>
  <circle cx="440" cy="390" r="2" fill="#4A3828" opacity="0.7"/>
  <circle cx="380" cy="440" r="3" fill="#4A3828" opacity="0.5"/>
  <circle cx="430" cy="470" r="2" fill="#4A3828" opacity="0.6"/>
  <circle cx="350" cy="490" r="2.5" fill="#4A3828" opacity="0.55"/>
  <circle cx="420" cy="340" r="2" fill="#4A3828" opacity="0.5"/>
