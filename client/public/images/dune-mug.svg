<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dune-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6EFE5"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </linearGradient>
    <linearGradient id="dune-clay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7CCC0"/>
      <stop offset="35%" stop-color="#FBF7F0"/>
      <stop offset="70%" stop-color="#DFD5C8"/>
      <stop offset="100%" stop-color="#C2B29F"/>
    </linearGradient>
    <linearGradient id="dune-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B85D38"/>
      <stop offset="50%" stop-color="#D4764E"/>
      <stop offset="100%" stop-color="#8F3F1F"/>
    </linearGradient>
    <radialGradient id="dune-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(40,25,15,0.28)"/>
      <stop offset="100%" stop-color="rgba(40,25,15,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#dune-bg)"/>
  <circle cx="400" cy="400" r="280" fill="#FFFDF8" opacity="0.5"/>
