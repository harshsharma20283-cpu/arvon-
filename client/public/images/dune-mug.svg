  <!-- Body -->
  <path d="M310 290 L325 570 Q326 600 355 600 L445 600 Q474 600 475 570 L490 290 Z" fill="url(#dune-clay)"/>
  <!-- Terracotta Rim Base -->
  <path d="M322 535 L325 570 Q326 600 355 600 L445 600 Q474 600 475 570 L478 535 Q400 550 322 535 Z" fill="url(#dune-base)"/>
  <!-- Top Rim -->
  <ellipse cx="400" cy="290" rx="90" ry="22" fill="#DFD4C6" stroke="#BAAA97" stroke-width="2"/>
  <ellipse cx="400" cy="290" rx="78" ry="16" fill="#C9B8A2"/>
  <ellipse cx="400" cy="293" rx="70" ry="12" fill="#5A4736" opacity="0.85"/>
